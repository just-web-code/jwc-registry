name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Namespace is NOT hardcoded — the "Resolve image name" step in each job
  # sets IMAGE_NAME from the repo owner at run time. It used to read
  # `nodirbek-abdulaxadov/jwc-registry`; a workflow token may only write
  # packages under its own owner, so once the repo moves orgs the push
  # fails with `permission_denied: The requested installation does not
  # exist`. That is what took the sibling jwc-lang repo's docs and docker
  # workflows down on its v0.8.7 release.
  IMAGE_REPO: jwc-registry

jobs:
  build-and-push:
    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # ghcr rejects an uppercase path segment, and the previous owner
      # (`Nodirbek-Abdulaxadov`) was mixed case — so lowercase it rather
      # than interpolating `github.repository_owner` directly.
      - name: Resolve image name
        shell: bash
        run: |
          owner="${{ github.repository_owner }}"
          echo "IMAGE_NAME=${owner,,}/${IMAGE_REPO}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    name: Update GitOps Repo
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      # Repeated here on purpose: `$GITHUB_ENV` does not cross job
      # boundaries, and this is a separate job from build-and-push. Without
      # it IMAGE_NAME is empty and the tag below becomes `ghcr.io/:main-…`.
      - name: Resolve image name
        shell: bash
        run: |
          owner="${{ github.repository_owner }}"
          echo "IMAGE_NAME=${owner,,}/${IMAGE_REPO}" >> "$GITHUB_ENV"

      - name: Checkout GitOps repo
        uses: actions/checkout@v5
        with:
          repository: musanna-soft/k8s-gitops
          token: ${{ secrets.GITOPS_PAT }}

      - name: Update jwc-registry image tag
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${IMAGE_NAME}:main-${{ github.sha }}"
          FILE="apps/jwc-registry/deployment.yaml"

          # Matches on the image name only, so the namespace change from the
          # org move heals itself instead of silently matching nothing.
          sed -i -E "s|image:[[:space:]]*[^[:space:]]*/${IMAGE_REPO}:[^[:space:]]*|image: ${IMAGE_TAG}|g" "$FILE"

          # A no-op sed is a deploy that silently doesn't happen. Fail loud.
          if ! grep -qF "image: ${IMAGE_TAG}" "$FILE"; then
            echo "::error ::sed did not update $FILE — no line matched '/${IMAGE_REPO}:'. Current image lines:"
            grep -n "image:" "$FILE" || true
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add apps/jwc-registry/deployment.yaml
          git commit -m "Deploy jwc-registry main-${{ github.sha }}" || exit 0
          git push
